<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot</title>
    <!-- Font Awesome Library for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="../static/style.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <!-- Chatbot Icon (Envelope icon) -->
    <div id="chatbotIcon" class="chatbot-icon">
        <i class="fas fa-commenting"></i> <!-- Font Awesome Envelope Icon -->
    </div>

    <!-- Chat Window -->
    <div id="chatWindow" class="chat-container">
        <div class="chat-header">
            <span class="chat-title">My Animal</span>
            <button id="closeButton" class="close-button">X</button>
        </div>
        <div class="Messages_list"></div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your message..." />
            <button id="sendButton" class="send-button">
                <i class="fas fa-paper-plane"></i> <!-- Font Awesome send icon -->
            </button>
        </div>
    </div>

    <script src="../static/script.js"></script>
</body>
</html>
